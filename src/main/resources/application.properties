spring.application.name=netball-manager-backend
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:netballmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-this-before-production-123456}
app.jwt.expiration=PT12H
app.bootstrap-coach.email=${BOOTSTRAP_COACH_EMAIL:}
app.bootstrap-coach.password=${BOOTSTRAP_COACH_PASSWORD:}
